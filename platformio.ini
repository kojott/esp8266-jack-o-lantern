; WiFi Jack-o'-Lantern – flickering candle on ESP-12F + 4x WS2812B

[env]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

; First flash over a USB-serial adapter (jumper GPIO0 to GND while powering up)
[env:serial]
upload_speed = 115200
upload_resetmethod = nodemcu

; Every later update over WiFi: pio run -e ota -t upload
; A renamed pumpkin:             pio run -e ota -t upload --upload-port jack.local
[env:ota]
upload_protocol = espota
upload_port = candle.local
upload_flags = --auth=candle
